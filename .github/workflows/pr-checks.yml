# Read-only PR gates

name: pr-checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# New pushes replace a previous run on the same ref
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start postgres, azurite and minio
        run: npm run db:up

      - run: npm test

      - name: Service logs on failure
        if: failure()
        run: docker compose -f compose.dev.yml logs --tail=80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # tests the build (does not release any image)
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: speicher:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check for missing runtime dependencies
        run: |
          docker run --rm speicher:pr speicher help > /dev/null
          docker run --rm --entrypoint node speicher:pr -e "
            require('/app/dist/app.module.js');
            require('node:fs').accessSync('/app/dist/worker.js');
          "
