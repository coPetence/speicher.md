# Publishes the container image, drafts a GitHub Release and records the release in Linear

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/copetence/speicher.md

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # building only from main as main must have passed pr-checks
      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag is not an ancestor of main" >&2; exit 1; }

      # makes sure the version in package.json is the same
      - name: Tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          [ "$PKG" = "${GITHUB_REF_NAME#v}" ] || {
            echo "package.json is $PKG, tag is ${GITHUB_REF_NAME#v}" >&2
            exit 1
          }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker image tags:
      # Git tag: vX.Y.Z -> Image tag:  X.Y.Z, X.Y, latest
      # Git tag: vX.Y.Z-rc.1 -> Image tag:  X.Y.Z-rc.1
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto # if the tag has a pre-release component (-rc / -beta...) latest is not added as an image tag
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # check if the image boots
      - name: Pull image and check build
        run: |
          REF="${IMAGE}:${GITHUB_REF_NAME#v}"
          docker run --rm --entrypoint node "$REF" -e "require('/app/dist/app.module.js')"

  # Tests run migrations
  migrate:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: speicher
          POSTGRES_PASSWORD: speicher
          POSTGRES_DB: speicher
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U speicher -d speicher"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      # Currently the package is private so it needs login to pull the image
      # TODO: remove the authentication as soon as packages are publically availiable
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Migrate a fresh database with the shipped image
        env:
          SPEICHER_DATABASE_URL: postgres://speicher:speicher@localhost:5432/speicher
        run: |
          REF="${IMAGE}:${GITHUB_REF_NAME#v}"
          LAST=$(basename "$(ls src/db/migrations/*.ts | sort | tail -1)" .ts)

          docker run --rm --network host -e SPEICHER_DATABASE_URL "$REF" speicher migrate up > /tmp/up 2>&1
          cat /tmp/up
          docker run --rm --network host -e SPEICHER_DATABASE_URL "$REF" speicher migrate status > /tmp/status 2>&1
          cat /tmp/status

          grep -q "$LAST" /tmp/up || { echo "expected $LAST in the applied list" >&2; exit 1; }
          grep -q '"pending":\[\]' /tmp/status || { echo "migrations still pending" >&2; exit 1; }

  release:
    needs: [image, migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # pins the install script to this release's image tag
      - name: Stamp install script
        run: |
          mkdir -p dist
          sed "s/^SPEICHER_VERSION=\"__VERSION__\"$/SPEICHER_VERSION=\"${GITHUB_REF_NAME#v}\"/" \
            deploy/install.sh > dist/install.sh
          grep -q "^SPEICHER_VERSION=\"${GITHUB_REF_NAME#v}\"$" dist/install.sh \
            || { echo "failed to stamp the version into install.sh" >&2; exit 1; }

            - name: Draft release
            env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
              run: |
              gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              $PRERELEASE \
              dist/install.sh

  # Records the release in Linear
  # stable releases use the Linear access key, pre-releases use the RC access key
  linear:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # stable releases: scan from the last stable tag
      # pre-releases scan from the last tag of any kind
      - id: prev
        env:
          EXCLUDE: ${{ contains(github.ref_name, '-') && '' || '*-*' }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' ${EXCLUDE:+--exclude "$EXCLUDE"} "${GITHUB_SHA}^" 2>/dev/null || true)
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - uses: linear/linear-release-action@v0
        with:
          access_key: ${{ contains(github.ref_name, '-') && secrets.LINEAR_RC_ACCESS_KEY || secrets.LINEAR_ACCESS_KEY }}
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          base_ref: ${{ steps.prev.outputs.tag }}
          links: |
            https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
