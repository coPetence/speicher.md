services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: speicher
      POSTGRES_PASSWORD: speicher
      POSTGRES_DB: speicher
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U speicher -d speicher']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - speicher-db:/var/lib/postgresql/data

  # Local Azure Blob storage emulator
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: 'azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck'
    ports:
      - '51000:10000'
    volumes:
      - speicher-blobs:/data

  # Local S3-compatible object storage, for the s3 asset driver
  s3:
    image: chainguard/minio:latest
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: speicher
      MINIO_ROOT_PASSWORD: speicher-secret
    ports:
      - '51001:9000'
    healthcheck:
      test:
        - CMD-SHELL
        - mc alias set h http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null && mc ready h
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  speicher-db:
  speicher-blobs:
